#
# The German identity card, the French health insurance number and card
# magnetic stripe data: Macie's GERMANY_NATIONAL_IDENTIFICATION_NUMBER,
# FRANCE_HEALTH_INSURANCE_NUMBER and CREDIT_CARD_MAGNETIC_STRIPE, as our
# stand-ins. All require a keyword. Two categories: findings group the
# first two under PERSONAL_INFORMATION and the stripe under
# FINANCIAL_INFORMATION.
#
#   conversion:     MacieConverter.convert() arguments (see below)
#   csvpath:        file in expected/ to run; the converter's exact output
#   finding_lines:  0-based physical line numbers (header is line 0) that
#                   must match, i.e. lines with at least one finding.
#                   Every other data line must not match.
#   printouts:      expected printouts of the "macie" print stream, exact
#   errors:         the run's collected errors (errors.json): line and
#                   message, in order. One per detailed occurrence.
#   findings:       expected/findings.json, compared with the run's
#                   macie_findings variable (vars.json)
#
# Macie numbering in findings: row = line + 1 (header is row 1), column is
# 1-based.
#
# Arguments the normative tests pass to MacieConverter.convert() to
# produce expected/<csvpath>. The converter's defaults are used for
# anything not listed.
#
conversion:
  max_detail: 2
runs:
  - csvpath: group-a-members.csvpath
    data: members.csv
    finding_lines: [1, 3, 5, 7, 8]
    printouts:
      macie: printouts.macie.txt
    errors:
      - { line: 1, message: "macie GERMANY_NATIONAL_IDENTIFICATION_NUMBER: occurrence 1, line 1 (row 2), column 2 ausweisnummer" }
      - { line: 3, message: "macie FRANCE_HEALTH_INSURANCE_NUMBER: occurrence 1, line 3 (row 4), column 3 carte_vitale" }
      - { line: 5, message: "macie CREDIT_CARD_MAGNETIC_STRIPE: occurrence 1, line 5 (row 6), column 4 swipe" }
      - { line: 7, message: "macie GERMANY_NATIONAL_IDENTIFICATION_NUMBER: occurrence 2, line 7 (row 8), column 5 notes" }
      - { line: 7, message: "macie CREDIT_CARD_MAGNETIC_STRIPE: occurrence 2, line 7 (row 8), column 5 notes" }
      - { line: 8, message: "macie FRANCE_HEALTH_INSURANCE_NUMBER: occurrence 2, line 8 (row 9), column 5 notes" }
    findings: findings.json
    #
    # Headers: "ausweisnummer" is a Germany keyword, "carte_vitale" the
    # France health keyword "carte vitale" (space as _), "swipe" a stripe
    # keyword; "id" and "notes" hold none.
    #
    #   line  cell                                    reported as
    #   1     ausweisnummer T220001293                identity card: the specimen,
    #                                                 ICAO 7-3-1 check digit 3
    #   2     ausweisnummer T220001294                nothing: bad check digit
    #   3     carte_vitale 2 95 10 99 126 111 93      health insurance: a NIR
    #   4     carte_vitale 295109912611199            nothing: bad NIR key
    #   5     swipe %B4111...^DOE/JOHN^2512101...?    stripe: track 1
    #   6     swipe ;4111111111111112=2512101?        nothing: the card number
    #                                                 fails Luhn
    #   7     notes "personalausweis t220001293,      identity card (lower case) and
    #         mag ;4111111111111111=2512101?"         stripe (track 2), one cell
    #   8     notes "insurance card 253072B07300470"  health insurance: a Corsican NIR
    #   9     notes T220001293                        nothing: no keyword
    #
    # On each line the identifiers run in the wrapper's resolved order.
    # Totals: identity card 2, health insurance 2, stripe 2; all HIGH from
    # one occurrence. PERSONAL_INFORMATION totalCount 4,
    # FINANCIAL_INFORMATION totalCount 2.
