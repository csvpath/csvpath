#
# US health and taxpayer identifiers: Macie's
# US_DRUG_ENFORCEMENT_AGENCY_NUMBER, USA_MEDICARE_BENEFICIARY_IDENTIFIER,
# USA_INDIVIDUAL_TAX_IDENTIFICATION_NUMBER,
# USA_HEALTH_INSURANCE_CLAIM_NUMBER, USA_NATIONAL_DRUG_CODE and
# USA_HEALTHCARE_PROCEDURE_CODE, as our stand-ins. All require a
# keyword. Macie publishes only the keywords; the formats are the
# issuers'. The HICN identifier is partial (no Railroad Retirement Board
# numbers), which the conversion report says.
#
#   conversion:     MacieConverter.convert() arguments (see below)
#   csvpath:        file in expected/ to run; the converter's exact output
#   finding_lines:  0-based physical line numbers (header is line 0) that
#                   must match, i.e. lines with at least one finding.
#                   Every other data line must not match.
#   printouts:      expected printouts of the "macie" print stream, exact
#   errors:         the run's collected errors (errors.json): line and
#                   message, in order. One per detailed occurrence.
#   findings:       expected/findings.json, compared with the run's
#                   macie_findings variable (vars.json)
#
# Macie numbering in findings: row = line + 1 (header is row 1), column is
# 1-based.
#
# Arguments the normative tests pass to MacieConverter.convert() to
# produce expected/<csvpath>. The converter's defaults are used for
# anything not listed.
#
conversion:
  max_detail: 2
runs:
  - csvpath: us-health-claims.csvpath
    data: claims.csv
    finding_lines: [1, 3, 5, 6, 8, 10, 11, 12, 14, 16]
    printouts:
      macie: printouts.macie.txt
    errors:
      - { line: 1, message: "macie US_DRUG_ENFORCEMENT_AGENCY_NUMBER: occurrence 1, line 1 (row 2), column 2 dea_number" }
      - { line: 3, message: "macie USA_MEDICARE_BENEFICIARY_IDENTIFIER: occurrence 1, line 3 (row 4), column 3 mbi" }
      - { line: 5, message: "macie USA_INDIVIDUAL_TAX_IDENTIFICATION_NUMBER: occurrence 1, line 5 (row 6), column 4 itin" }
      - { line: 6, message: "macie USA_INDIVIDUAL_TAX_IDENTIFICATION_NUMBER: occurrence 2, line 6 (row 7), column 4 itin" }
      - { line: 8, message: "macie USA_HEALTH_INSURANCE_CLAIM_NUMBER: occurrence 1, line 8 (row 9), column 5 hicn" }
      - { line: 10, message: "macie USA_NATIONAL_DRUG_CODE: occurrence 1, line 10 (row 11), column 6 ndc" }
      - { line: 11, message: "macie USA_NATIONAL_DRUG_CODE: occurrence 2, line 11 (row 12), column 6 ndc" }
      - { line: 12, message: "macie USA_HEALTHCARE_PROCEDURE_CODE: occurrence 1, line 12 (row 13), column 7 hcpcs" }
      - { line: 14, message: "macie US_DRUG_ENFORCEMENT_AGENCY_NUMBER: occurrence 2, line 14 (row 15), column 8 notes" }
      - { line: 14, message: "macie USA_MEDICARE_BENEFICIARY_IDENTIFIER: occurrence 2, line 14 (row 15), column 8 notes" }
      - { line: 16, message: "macie USA_HEALTHCARE_PROCEDURE_CODE: occurrence 2, line 16 (row 17), column 8 notes" }
    findings: findings.json
    #
    # Each column's header is its identifier's keyword ("dea_number" is
    # "dea number" with _); "id" and "notes" hold none.
    #
    #   line  cell                                    reported as
    #   1     dea AB1234563                           DEA: 1+3+5 + 2*(2+4+6) = 33
    #   2     dea AB1234564                           nothing: bad check digit
    #   3     mbi 2AC3-DE4-FG56                       MBI: positions, dashes
    #   4     mbi 1EG4-TE5-MK73                       nothing: CMS's example (ours)
    #   5     itin 912-90-3456                        ITIN
    #   6     itin 912-55-3456                        ITIN: a middle range from 2011
    #   7     itin 912-93-4567                        nothing: 93 is not an ITIN range
    #   8     hicn 123-45-6789A                       HICN: an SSN and a code
    #   9     hicn 000-45-6789A                       nothing: area 000 is no SSN
    #   10    ndc 0002-1433-80                        NDC: 4-4-2
    #   11    ndc 12345-6789-01                       NDC: the 11 digit billing form
    #   12    hcpcs J1234                             HCPCS: Level II
    #   13    hcpcs W1234                             nothing: W is not a Level II letter
    #   14    notes "dea registration FB9876547;      DEA and MBI, one cell, each
    #         medicare beneficiary 9Y99Y99YY99"       with its keyword before
    #   15    notes "cpt 99213"                       nothing: cpt is not one of
    #                                                 Macie's keywords
    #   16    notes "ndc 1234567890 hcpcs 0001F"      NDC (contiguous) and HCPCS (a
    #                                                 CPT category II code)
    #
    # On each line the identifiers run in the wrapper's resolved order.
    # Totals: DEA 2, MBI 2, ITIN 2, HICN 1, NDC 3 (lines 10, 11, 16; the
    # third past the cap of 2), HCPCS 2. All HIGH from one occurrence. All
    # are PERSONAL_INFORMATION: totalCount 12.
