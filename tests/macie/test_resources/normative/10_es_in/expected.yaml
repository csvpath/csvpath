#
# Spain DNI and NIE numbers and India Aadhaar numbers: Macie's
# SPAIN_DNI_NUMBER, SPAIN_NIE_NUMBER and INDIA_AADHAAR_NUMBER, as our
# stand-ins. All three require a keyword. Macie publishes the keywords and
# the DNI exclusions; the formats are the issuers'.
#
#   conversion:     MacieConverter.convert() arguments (see below)
#   csvpath:        file in expected/ to run; the converter's exact output
#   finding_lines:  0-based physical line numbers (header is line 0) that
#                   must match, i.e. lines with at least one finding.
#                   Every other data line must not match.
#   printouts:      expected printouts of the "macie" print stream, exact
#   errors:         the run's collected errors (errors.json): line and
#                   message, in order. One per detailed occurrence.
#   findings:       expected/findings.json, compared with the run's
#                   macie_findings variable (vars.json)
#
# Macie numbering in findings: row = line + 1 (header is row 1), column is
# 1-based.
#
# Arguments the normative tests pass to MacieConverter.convert() to
# produce expected/<csvpath>. The converter's defaults are used for
# anything not listed.
#
conversion:
  max_detail: 2
runs:
  - csvpath: es-in-residents.csvpath
    data: residents.csv
    finding_lines: [1, 2, 5, 6, 8, 11, 12, 14]
    printouts:
      macie: printouts.macie.txt
    errors:
      - { line: 1, message: "macie SPAIN_DNI_NUMBER: occurrence 1, line 1 (row 2), column 2 dni" }
      - { line: 2, message: "macie SPAIN_DNI_NUMBER: occurrence 2, line 2 (row 3), column 2 dni" }
      - { line: 5, message: "macie SPAIN_NIE_NUMBER: occurrence 1, line 5 (row 6), column 3 nie" }
      - { line: 6, message: "macie SPAIN_NIE_NUMBER: occurrence 2, line 6 (row 7), column 3 nie" }
      - { line: 8, message: "macie INDIA_AADHAAR_NUMBER: occurrence 1, line 8 (row 9), column 4 aadhaar" }
      - { line: 12, message: "macie INDIA_AADHAAR_NUMBER: occurrence 2, line 12 (row 13), column 5 notes" }
    findings: findings.json
    #
    # Headers: "dni" holds a DNI keyword, "nie" a keyword of Spain's
    # taxpayer list (the NIE's), "aadhaar" an Aadhaar keyword; "id" and
    # "notes" hold none.
    #
    #   line  cell                                    reported as
    #   1     dni 12345678Z                           DNI: header keyword, mod 23 letter
    #   2     dni 12.345.678-Z                        DNI: dotted, hyphen before the letter
    #   3     dni 12345678A                           nothing: wrong letter (Z)
    #   4     dni 99999999R                           nothing: right letter, but Macie
    #                                                 never reports 99999999
    #   5     nie X1234567L                           NIE
    #   6     nie Y-1234567-X                         NIE: hyphens, Y as 1
    #   7     nie X0000000T                           nothing: right letter, all zeroes
    #   8     aadhaar 2345 6789 0124                  Aadhaar: groups of four, Verhoeff
    #   9     aadhaar 123456789010                    nothing: passes Verhoeff, but no
    #                                                 Aadhaar starts with 0 or 1
    #   10    aadhaar 234567890125                    nothing: bad check digit
    #   11    notes "dni 87654321X y nie              DNI ("dni" before) and NIE ("nie"
    #         Z7654321H"                              before, Z as 2), one cell
    #   12    notes "uidai 9876 5432 1012"            Aadhaar: "uidai" before
    #   13    notes 12345678Z                         nothing: no keyword
    #   14    notes "aadhaar 2345 6789 0124 y DNI     Aadhaar ("aadhaar" before) and
    #         12345678Z"                              DNI ("DNI", any case), one cell
    #
    # On each line DNI, then NIE, then Aadhaar: the wrapper's resolved
    # order. Totals: DNI 4 (lines 1, 2, 11, 14), NIE 3 (5, 6, 11), Aadhaar
    # 3 (8, 12, 14), so with a detail cap of 2 each shows its first 2.
    # Macie scores national identification and taxpayer numbers HIGH from
    # one occurrence. All three are PERSONAL_INFORMATION: totalCount 10.
