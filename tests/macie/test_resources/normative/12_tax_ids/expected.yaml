#
# Germany Steuer-IdNr, Argentina CUIT and CUIL (individuals and
# organizations), Australia TFN and UK UTR: Macie's
# GERMANY_TAX_IDENTIFICATION_NUMBER, ARGENTINA_INDIVIDUAL_ and
# ARGENTINA_ORGANIZATION_TAX_IDENTIFICATION_NUMBER,
# AUSTRALIA_TAX_FILE_NUMBER and UK_TAX_IDENTIFICATION_NUMBER, as our
# stand-ins. All require a keyword. Macie publishes only the keywords; the
# formats are the issuers'. The TFN and UTR identifiers are partial (no
# 8 digit TFNs, no TRNs), which the conversion report says.
#
#   conversion:     MacieConverter.convert() arguments (see below)
#   csvpath:        file in expected/ to run; the converter's exact output
#   finding_lines:  0-based physical line numbers (header is line 0) that
#                   must match, i.e. lines with at least one finding.
#                   Every other data line must not match.
#   printouts:      expected printouts of the "macie" print stream, exact
#   errors:         the run's collected errors (errors.json): line and
#                   message, in order. One per detailed occurrence.
#   findings:       expected/findings.json, compared with the run's
#                   macie_findings variable (vars.json)
#
# Macie numbering in findings: row = line + 1 (header is row 1), column is
# 1-based.
#
# Arguments the normative tests pass to MacieConverter.convert() to
# produce expected/<csvpath>. The converter's defaults are used for
# anything not listed.
#
conversion:
  max_detail: 2
runs:
  - csvpath: tax-ids-taxpayers.csvpath
    data: taxpayers.csv
    finding_lines: [1, 2, 4, 5, 7, 9, 11, 12, 13]
    printouts:
      macie: printouts.macie.txt
    errors:
      - { line: 1, message: "macie GERMANY_TAX_IDENTIFICATION_NUMBER: occurrence 1, line 1 (row 2), column 2 steuer_id" }
      - { line: 2, message: "macie GERMANY_TAX_IDENTIFICATION_NUMBER: occurrence 2, line 2 (row 3), column 2 steuer_id" }
      - { line: 4, message: "macie ARGENTINA_INDIVIDUAL_TAX_IDENTIFICATION_NUMBER: occurrence 1, line 4 (row 5), column 3 cuit" }
      - { line: 5, message: "macie ARGENTINA_ORGANIZATION_TAX_IDENTIFICATION_NUMBER: occurrence 1, line 5 (row 6), column 3 cuit" }
      - { line: 7, message: "macie AUSTRALIA_TAX_FILE_NUMBER: occurrence 1, line 7 (row 8), column 4 tfn" }
      - { line: 9, message: "macie UK_TAX_IDENTIFICATION_NUMBER: occurrence 1, line 9 (row 10), column 5 utr" }
      - { line: 11, message: "macie ARGENTINA_INDIVIDUAL_TAX_IDENTIFICATION_NUMBER: occurrence 2, line 11 (row 12), column 6 notes" }
      - { line: 11, message: "macie AUSTRALIA_TAX_FILE_NUMBER: occurrence 2, line 11 (row 12), column 6 notes" }
      - { line: 13, message: "macie UK_TAX_IDENTIFICATION_NUMBER: occurrence 2, line 13 (row 14), column 6 notes" }
    findings: findings.json
    #
    # Headers: "steuer_id" holds the Germany keyword "steuer id" (space as
    # _), "cuit" the Argentina keyword shared by both CUIT identifiers,
    # "tfn" the Australia keyword, "utr" a UK keyword; "id" and "notes"
    # hold none.
    #
    #   line  cell                                    reported as
    #   1     steuer_id 36 574 261 809                IdNr: groups 2-3-3-3
    #   2     steuer_id 47773125600                   IdNr: one digit three times
    #   3     steuer_id 36554266806                   nothing: two digits repeated
    #   4     cuit 20-05536168-2                      CUIT individual: type 20
    #   5     cuit 30-71234567-1                      CUIT organization: type 30
    #   6     cuit 20-26756539-2                      nothing: bad check digit
    #   7     tfn 123 456 782                         TFN: groups 3-3-3
    #   8     tfn 12345678                            nothing: 8 digits, older TFNs are
    #                                                 not detected (partial)
    #   9     utr 19558 39661                         UTR: groups 5-5, check digit first
    #   10    utr 2955839661                          nothing: bad check digit
    #   11    notes "cuil 20-26756539-3; tfn          CUIT individual ("cuil" before)
    #         123456782"                              and TFN ("tfn" before), one cell
    #   12    notes "Steuer-ID 47893125709"           IdNr: "Steuer-ID" is "steuer id"
    #                                                 with a hyphen, any case
    #   13    notes "UTR 2234567890"                  UTR: keyword before
    #   14    notes 20055361682                       nothing: no keyword
    #
    # On each line the identifiers run in the wrapper's resolved order, so
    # on line 11 the CUIT comes before the TFN. Totals: IdNr 3 (lines 1, 2,
    # 12; the third past the cap of 2), CUIT individual 2 (4, 11), CUIT
    # organization 1 (5), TFN 2 (7, 11), UTR 2 (9, 13). Macie scores
    # taxpayer numbers HIGH from one occurrence, except organizations'
    # CUITs: MEDIUM for 1-99. All are PERSONAL_INFORMATION: totalCount 10.
