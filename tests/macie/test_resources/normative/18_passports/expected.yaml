#
# Passport numbers, the second group B step: Macie's CANADA_, FRANCE_,
# GERMANY_, ITALY_, SPAIN_, UK_ and USA_PASSPORT_NUMBER, as our stand-ins,
# in FormatDetector's notation. All require a keyword. Several countries
# share keywords and shapes, so one number can be reported by more than
# one identifier; this pair shows where.
#
#   conversion:     MacieConverter.convert() arguments (see below)
#   csvpath:        file in expected/ to run; the converter's exact output
#   finding_lines:  0-based physical line numbers (header is line 0) that
#                   must match, i.e. lines with at least one finding.
#                   Every other data line must not match.
#   printouts:      expected printouts of the "macie" print stream, exact
#   errors:         the run's collected errors (errors.json): line and
#                   message, in order. One per detailed occurrence.
#   findings:       expected/findings.json, compared with the run's
#                   macie_findings variable (vars.json)
#
# Macie numbering in findings: row = line + 1 (header is row 1), column is
# 1-based.
#
# Arguments the normative tests pass to MacieConverter.convert() to
# produce expected/<csvpath>. The converter's defaults are used for
# anything not listed.
#
conversion:
  max_detail: 2
runs:
  - csvpath: group-b-passports.csvpath
    data: travelers.csv
    finding_lines: [1, 2, 3, 5, 6, 7, 9]
    printouts:
      macie: printouts.macie.txt
    errors:
      - { line: 1, message: "macie CANADA_PASSPORT_NUMBER: occurrence 1, line 1 (row 2), column 2 passport" }
      - { line: 1, message: "macie SPAIN_PASSPORT_NUMBER: occurrence 1, line 1 (row 2), column 2 passport" }
      - { line: 2, message: "macie USA_PASSPORT_NUMBER: occurrence 1, line 2 (row 3), column 2 passport" }
      - { line: 3, message: "macie GERMANY_PASSPORT_NUMBER: occurrence 1, line 3 (row 4), column 2 passport" }
      - { line: 5, message: "macie FRANCE_PASSPORT_NUMBER: occurrence 1, line 5 (row 6), column 3 notes" }
      - { line: 6, message: "macie ITALY_PASSPORT_NUMBER: occurrence 1, line 6 (row 7), column 3 notes" }
      - { line: 7, message: "macie UK_PASSPORT_NUMBER: occurrence 1, line 7 (row 8), column 3 notes" }
      - { line: 7, message: "macie USA_PASSPORT_NUMBER: occurrence 2, line 7 (row 8), column 3 notes" }
      - { line: 9, message: "macie SPAIN_PASSPORT_NUMBER: occurrence 2, line 9 (row 10), column 2 passport" }
    findings: findings.json
    #
    # Header "passport" is a keyword of Canada's, Germany's, Spain's and
    # the US's lists, not of France's, Italy's or the UK's.
    #
    #   line  cell                                    reported as
    #   1     passport AB123456                       Canada AND Spain: both
    #                                                 have this shape (Spain's
    #                                                 older form) and the keyword
    #   2     passport A12345678                      US: a letter and 8 digits
    #   3     passport C01X00T47                      Germany
    #   4     passport 12AB34567                      nothing: France's shape, but
    #                                                 France's keywords are French
    #   5     notes "numéro de passeport 12AB34567"   France
    #   6     notes "passaporto YA1234567"            Italy
    #   7     notes "passport number 123456789"       UK AND US: 9 digits, and both
    #                                                 lists have "passport number"
    #   8     notes 123456789                         nothing: no keyword
    #   9     passport PAA123456                      Spain: 3 letters, 6 digits
    #
    # On each line the identifiers run in the wrapper's resolved order.
    # Passport numbers are MEDIUM for one occurrence, HIGH from two: Spain
    # and the US have two here. All PERSONAL_INFORMATION: totalCount 9.
