#
# EHIC card numbers and medical device UDIs, the last group A leftovers:
# Macie's EUROPEAN_HEALTH_INSURANCE_CARD_NUMBER,
# FINLAND_EUROPEAN_HEALTH_INSURANCE_NUMBER and MEDICAL_DEVICE_UDI, all
# requiring a keyword. An EHIC card number is 20 digits, 80 and the
# issuing country's numeric code (Finland 246); a UDI is GS1 or HIBCC,
# with its check.
#
#   conversion:     MacieConverter.convert() arguments (see below)
#   csvpath:        file in expected/ to run; the converter's exact output
#   finding_lines:  0-based physical line numbers (header is line 0) that
#                   must match, i.e. lines with at least one finding.
#                   Every other data line must not match.
#   printouts:      expected printouts of the "macie" print stream, exact
#   errors:         the run's collected errors (errors.json): line and
#                   message, in order. One per detailed occurrence.
#   findings:       expected/findings.json, compared with the run's
#                   macie_findings variable (vars.json)
#
# Macie numbering in findings: row = line + 1 (header is row 1), column is
# 1-based.
#
# Arguments the normative tests pass to MacieConverter.convert() to
# produce expected/<csvpath>. The converter's defaults are used for
# anything not listed.
#
conversion:
  max_detail: 2
runs:
  - csvpath: group-a-ehic-udi.csvpath
    data: claims.csv
    finding_lines: [1, 2, 4, 5]
    printouts:
      macie: printouts.macie.txt
    errors:
      - { line: 1, message: "macie EUROPEAN_HEALTH_INSURANCE_CARD_NUMBER: occurrence 1, line 1 (row 2), column 2 ehic" }
      - { line: 2, message: "macie EUROPEAN_HEALTH_INSURANCE_CARD_NUMBER: occurrence 2, line 2 (row 3), column 3 notes" }
      - { line: 2, message: "macie FINLAND_EUROPEAN_HEALTH_INSURANCE_NUMBER: occurrence 1, line 2 (row 3), column 3 notes" }
      - { line: 4, message: "macie MEDICAL_DEVICE_UDI: occurrence 1, line 4 (row 5), column 3 notes" }
      - { line: 5, message: "macie MEDICAL_DEVICE_UDI: occurrence 2, line 5 (row 6), column 3 notes" }
    findings: findings.json
    #
    #   line  cell                                    reported as
    #   1     ehic column "80276 00000 12345 67890"   EU: Germany's card; not
    #                                                 Finland's, which is 80246
    #   2     "terveyskortti 8024612345 6789012345"   EU and Finland: the keyword
    #                                                 is in both lists
    #   3     "ehic 12345678901234567890"             nothing: not 80 and a country
    #   4     "udi (01)00614141999996(17)250101(10)A1" UDI: GS1, with a date and lot
    #   5     "hibcc +A123BJC5D6E71G"                 UDI: HIBCC
    #   6     "device id +A123BJC5D6E71H"             nothing: the mod 43 check fails
    #   7     "(01)00614141999996"                    nothing: no keyword
    #
    # EHIC numbers are HIGH from one occurrence; UDIs LOW, MEDIUM from 2.
    # Totals: EU 2, Finland 1, UDI 2. PERSONAL_INFORMATION: totalCount 5.
