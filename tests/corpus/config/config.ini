[config]
path = tests/corpus/config/config.ini
allow_var_sub = True
var_sub_source = env

[extensions]
csvpath_files = txt, csvpath, csvpaths
csv_files = csv, tsv, dat, tab, psv, ssv

[errors]
csvpath = collect, print
csvpaths = collect, print
use_format = full
pattern = {time}:{file}:{line}:{paths}:{instance}:{chain}:  {message}

[logging]
csvpath = warn
csvpaths = warn
log_file = tests/corpus/data/logs/csvpath.log
log_files_to_keep = 10
log_file_size = 10485760
handler = file

[cache]
path = tests/corpus/data/cache
use_cache = no

[functions]
imports =

[results]
archive = tests/corpus/data/archive
transfers = tests/corpus/data/transfers

[inputs]
files = tests/corpus/data/inputs/named_files
csvpaths = tests/corpus/data/inputs/named_paths
on_unmatched_file_fingerprints = halt
allow_http_files = True
allow_local_files = True

[listeners]
groups = default
default.file = from csvpath.managers.files.files_listener import FilesListener
default.paths = from csvpath.managers.paths.paths_listener import PathsListener
